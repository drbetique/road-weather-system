# Periodically triggers one data collection cycle on the deployed API, which
# is what fills the dashboard's History tab over time.
#
# The standalone collector (src/collector.py) needs an always-on process, and
# Render's free tier offers no Background Workers, so collection is driven
# from here instead.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   BACKEND_URL  e.g. https://road-weather-api.onrender.com  (no trailing slash)
#   API_KEY      must match API_KEY on the Render service
#
# Optional repository secret:
#   RENDER_DEPLOY_HOOK  the service's Deploy Hook URL (Render -> service ->
#                       Settings -> Deploy Hook). When set, a backend that will
#                       not wake is redeployed once instead of failing the run.
#
# Notes:
#  - Scheduled runs on GitHub are best-effort. In practice fewer than half of
#    the requested slots fire, which is why this runs twice an hour to land
#    roughly one collection per hour.
#  - GitHub disables schedules after 60 days without repository activity.
#  - Each run costs Actions minutes on private repositories. At this cadence
#    that is roughly 700 minutes a month against the 2000 included; drop back
#    to "0 * * * *" if that headroom is needed elsewhere.

name: Collect road weather data

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

concurrency:
  group: collect-weather-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wake the backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -uo pipefail

          if [ -z "${BACKEND_URL:-}" ]; then
            echo "::error::BACKEND_URL repository secret must be set."
            exit 1
          fi

          # A free Render instance is torn down after 15 minutes idle and woken
          # by the next request. Holding the collection POST open across a slow
          # wake loses the cycle, so waking is a separate phase that polls the
          # public /health endpoint (no API key needed) until it answers.
          #
          # Usually it answers within a minute. Occasionally Render's wake gets
          # stuck instead: the router returns timeouts and HTTP 429 for as long
          # as anyone waits, and no instance ever starts. A redeploy clears
          # that, so after a bounded wait this redeploys once through the
          # Deploy Hook and waits again.
          wait_for_health() {
            local probes=$1 attempt code
            for attempt in $(seq 1 "$probes"); do
              code=$(curl -sS -o /dev/null -w '%{http_code}' \
                --max-time 20 "${BACKEND_URL%/}/health") || code="000"
              if [ "$code" = "200" ]; then
                echo "Backend awake after ${attempt} probe(s)."
                return 0
              fi
              echo "Probe ${attempt}: HTTP ${code}, still waking..."
              sleep 15
            done
            return 1
          }

          # About 6 minutes: well past a normal cold start.
          wait_for_health 12 && exit 0

          if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "::error::Backend did not wake and RENDER_DEPLOY_HOOK is not set, so it cannot be redeployed automatically."
            exit 1
          fi

          echo "::warning::Backend did not wake; redeploying it through the Deploy Hook."
          hook_code=$(curl -sS -X POST -o /dev/null -w '%{http_code}' \
            --max-time 30 "$RENDER_DEPLOY_HOOK") || hook_code="000"
          if [ "$hook_code" != "200" ] && [ "$hook_code" != "201" ]; then
            echo "::error::Deploy Hook returned HTTP ${hook_code}. Check the RENDER_DEPLOY_HOOK secret."
            exit 1
          fi

          # A redeploy builds and starts a fresh instance in about 1-2 minutes;
          # allow about 10.
          wait_for_health 20 && exit 0

          echo "::error::Backend still did not answer /health after a redeploy. Render may be having an outage."
          exit 1

      - name: Trigger a collection cycle
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          set -uo pipefail

          if [ -z "${API_KEY:-}" ]; then
            echo "::error::API_KEY repository secret must be set."
            exit 1
          fi

          # The instance is warm now, so a cycle takes about ten seconds. The
          # generous timeout covers a slow response from Digitraffic, not a
          # cold start.
          for attempt in 1 2; do
            echo "Attempt ${attempt}..."
            code=$(curl -sS -X POST \
              -o response.json -w '%{http_code}' \
              --max-time 120 \
              -H "X-API-Key: ${API_KEY}" \
              "${BACKEND_URL%/}/api/collect") || code="000"

            echo "HTTP ${code}"
            [ -s response.json ] && cat response.json && echo

            if [ "$code" = "200" ]; then
              echo "Collection cycle completed."
              exit 0
            fi

            # A missing database or a bad key will not fix itself on a retry.
            if [ "$code" = "401" ] || [ "$code" = "503" ]; then
              echo "::error::Collection refused (HTTP ${code}). Check API_KEY and DATABASE_URL."
              exit 1
            fi

            sleep 15
          done

          echo "::error::Collection did not succeed after 2 attempts."
          exit 1
