# Render Blueprint - Road Weather Monitoring System API
#
# Deploys the FastAPI service only. The collector (src/collector.py) is NOT
# deployed: Render Background Workers have no free instance type and Cron Jobs
# carry a $1/month minimum. Without the collector nothing writes to Postgres,
# so no database is provisioned either -- the history endpoints fall back to
# shaped mock responses. Live endpoints read Digitraffic/FMI on demand and are
# fully functional.
#
# History/persistence: set DATABASE_URL to any hosted Postgres. Because free
# instances have no Background Workers, collection is driven externally by
# .github/workflows/collect-weather-data.yml, which POSTs to /api/collect on a
# schedule. Without DATABASE_URL the live endpoints still work and the History
# tab reports that it has no data yet.

services:
  - type: web
    name: road-weather-api
    runtime: python
    plan: free
    region: frankfurt          # closest Render region to Finland
    # Pinned so the Blueprint owns the deploy branch. Without this Render keeps
    # whichever branch was picked in the UI at creation time, which was the
    # migration branch and is now merged.
    branch: master
    healthCheckPath: /health

    buildCommand: pip install -r requirements.txt

    # --app-dir puts src/ on sys.path so sibling imports (database, config,
    # digitraffic_client, ...) resolve. Running `uvicorn src.api:app` from the
    # repo root fails: `database` resolves to the top-level database/ directory.
    # $PORT is assigned by Render and must be honoured.
    startCommand: uvicorn api:app --app-dir src --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Display name for the monitored area. Its centre is REGION_LAT/REGION_LON,
      # which default to the original deployment's coordinates when unset.
      - key: REGION_NAME
        value: Monitored region
      # How many of the closest stations are collected (the rest are known but not read).
      - key: MAX_STATIONS
        value: "15"
      # Shared secret required by every /api/* route. Set in the Render
      # dashboard; must match API_KEY in the Vercel project.
      - key: API_KEY
        sync: false
      # Comma-separated origins for direct browser calls (scheme://host, no path).
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      # Postgres DSN. Without it the API still serves live weather, but the
      # History tab has nothing to accumulate into and stays empty.
      - key: DATABASE_URL
        sync: false
